name: Build One App
on:
  workflow_dispatch:
    inputs:
      app_id:        { description: "ID from repo-config.json", required: true }

      release_tag:   { description: "Release tag to create", required: true }
      catalog_ref:   { description: "Optional catalog info", required: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Build Release
        run: ./gradlew assembleRelease || gradle assembleRelease
      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "No APK"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          artifacts: ${{ env.APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
